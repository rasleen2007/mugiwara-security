name: Security Scan

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  mugiwara-scan:
    name: Mugiwara SARIF scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Mugiwara Security scan
        id: mugiwara
        continue-on-error: true
        uses: ./.github/actions/mugiwara-scan
        with:
          target: "."
          sarif-output: "mugiwara-results.sarif"
          fail-on-findings: "true"

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ hashFiles('mugiwara-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "mugiwara-results.sarif"

      - name: Enforce scan outcome
        if: ${{ steps.mugiwara.outcome == 'failure' }}
        run: |
          echo "::error::Mugiwara scan reported findings or failed; see Code Scanning alerts."
          exit 1
