# Mugiwara Security Configuration File
# For documentation, see docs/PROJECT_SPEC.md

log_level: INFO

llm:
  # 'mock' is the deterministic zero-network demo path. For real local
  # reasoning, switch to:
  #   provider: ollama
  #   model: llama3.2          # any model pulled into your local Ollama
  provider: mock
  model: gpt-4o
  temperature: 0.0
  max_tokens: 4096
  timeout_seconds: 60.0
  # api_key: Set via environment variable MUGIWARA_LLM__API_KEY (unused by mock)
  # api_base: null

sandbox:
  mode: docker
  # Image with the demo targets' runtime dependencies preinstalled
  # (build: docker build -f docker/demo-sandbox.Dockerfile -t mugiwara-sandbox-py-demo:latest .)
  image: "mugiwara-sandbox-py-demo:latest"
  timeout_seconds: 60
  memory_limit: 2g
  cpu_quota: 2.0

scan:
  profile: standard
  target_path: .
  dry_run: false
  max_turns: 10

output:
  format: text
  output_file: null
  include_evidence: true
