[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mugiwara"
description = "Autonomous AI-powered security testing and vulnerability verification platform"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Mugiwara Security Contributors" },
]
requires-python = ">=3.10"
keywords = [
    "security",
    "vulnerability-scanner",
    "ai-security",
    "pentesting",
    "appsec",
    "devsecops",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "docker>=7.0.0",
]
dynamic = ["version"]

[tool.hatch.version]
path = "src/mugiwara/__init__.py"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "pyrefly>=0.18.0",
]

[project.scripts]
mugiwara = "mugiwara.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mugiwara"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
mypy_path = "src"
exclude = "^tests/fixtures/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["tests/fixtures"]
extraPaths = ["src"]

[tool.pyrefly]
project-includes = ["src", "tests/conftest.py", "tests/unit", "tests/integration"]
search-path = ["src", "."]
python-version = "3.10"

